<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>A Birthday Surprise ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating decorative elements -->
    <div class="floating-elements">
        <span>♡</span>
        <span>✦</span>
        <span>♡</span>
        <span>✧</span>
        <span>♡</span>
        <span>✦</span>
        <span>♡</span>
        <span>✧</span>
    </div>


    <!-- =========================
         SCREEN 1
    ========================== -->

    <section id="welcomeScreen" class="screen welcome-screen">

        <div class="background-glow"></div>

        <!-- Top decoration -->
        <div class="top-decoration">
            <span>✦</span>
            <div></div>
            <span>♡</span>
            <div></div>
            <span>✦</span>
        </div>


        <main class="welcome-content">

            <p class="pre-title">
                A LITTLE SURPRISE
            </p>

            <div class="heart-icon">
                ♡
            </div>

            <h1>
                Hello Saranya chechi...
            </h1>

            <div class="divider">
                <span></span>
                <b>♡</b>
                <span></span>
            </div>

            <p class="message">
                I have something
                <br>
                <em>special</em> for you...
            </p>

        </main>


        <!-- Bottom area -->
        <div class="bottom-area">

            <button id="goButton" class="go-button">

                <span>GO</span>

                <span class="button-arrow">
                    →
                </span>

            </button>

            <p class="tap-text">
                Tap to continue
            </p>

        </div>


        <!-- Decorative flowers -->
        <div class="flower flower-left">
            🌹
        </div>

        <div class="flower flower-right">
            🌹
        </div>

        <div class="petal petal-one">❀</div>
        <div class="petal petal-two">✿</div>
        <div class="petal petal-three">❀</div>

    </section>



    <!-- =========================
         SCREEN 2
    ========================== -->

    <section id="videoScreen" class="screen video-screen">

        <div class="video-background-glow"></div>

        <main class="video-content">

            <!-- Heading -->
            <div class="birthday-title">

                <p class="tiny-title">
                    TODAY IS YOUR DAY
                </p>

                <h2>
                    Happy Birthday
                </h2>

                <div class="title-decoration">
                    <span>♡</span>
                    <div></div>
                    <span>✦</span>
                    <div></div>
                    <span>♡</span>
                </div>

            </div>


            <!-- Video -->
            <div class="video-frame">

                <div class="frame-glow"></div>

                <video
                    id="birthdayVideo"
                    controls
                    playsinline
                    preload="metadata"
                >
                    <source
                        src="birthday-video-new-web.mp4"
                        type="video/mp4"
                    >

                    Your browser does not support video playback.
                </video>

            </div>


            <!-- Bottom message -->
            <div class="video-message">

                <p>
                    A little memory,
                    <br>
                    made just for you
                    <span>♡</span>
                </p>

                <div class="small-divider">
                    <span></span>
                    ✦
                    <span></span>
                </div>

            </div>

        </main>

    </section>


    <script src="script.js"></script>

</body>
</html>
